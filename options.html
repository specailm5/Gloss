<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gloss settings</title>
    <style>
      body {
        margin: 16px;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-width: 320px;
        max-width: 440px;
      }
      h1 { font-size: 15px; margin: 0 0 10px; }
      .intro { color: #4b5563; margin: 0 0 14px; }
      section {
        margin-top: 14px;
        padding: 12px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 10px;
      }
      .row { display: flex; gap: 9px; align-items: flex-start; padding: 8px 0; cursor: pointer; }
      .row + .row { border-top: 1px solid rgba(0, 0, 0, 0.08); }
      .row input { margin-top: 3px; }
      .desc { color: #6b7280; font-size: 12.5px; }
      .status { color: #6b7280; font-size: 12.5px; margin: 12px 0 0; min-height: 1.5em; }
      @media (prefers-color-scheme: dark) {
        body { background: #1f1f23; color: #e8e8ea; }
        .intro, .status { color: #a1a1aa; }
        section { border-color: rgba(255, 255, 255, 0.14); }
        .row + .row { border-top-color: rgba(255, 255, 255, 0.1); }
        .desc { color: #a1a1aa; }
      }
    </style>
  </head>
  <body>
    <h1>Gloss settings</h1>
    <p class="intro">
      Gloss works out of the box. These extra sources are off by default. Turn on the
      ones you want; each asks your browser for permission to contact it.
    </p>

    <section>
      <label class="row">
        <input type="checkbox" data-origin="https://openlibrary.org/*" />
        <span><strong>Open Library</strong><br /><span class="desc">Book titles, authors and first publication year.</span></span>
      </label>
      <label class="row">
        <input type="checkbox" data-origin="https://api.crossref.org/*" />
        <span><strong>Crossref</strong><br /><span class="desc">Published papers, authors and citation counts.</span></span>
      </label>
      <label class="row">
        <input type="checkbox" data-origin="https://api.artic.edu/*" />
        <span><strong>Art Institute of Chicago</strong><br /><span class="desc">Artworks, artists, dates and medium.</span></span>
      </label>
      <label class="row">
        <input type="checkbox" data-origin="https://pubchem.ncbi.nlm.nih.gov/*" />
        <span><strong>PubChem</strong><br /><span class="desc">Chemical formulas, weights and names.</span></span>
      </label>
      <label class="row">
        <input type="checkbox" data-origin="https://api.gbif.org/*" />
        <span><strong>GBIF</strong><br /><span class="desc">Species names and classification.</span></span>
      </label>
      <label class="row">
        <input type="checkbox" data-origin="https://api.stackexchange.com/*" />
        <span><strong>Stack Overflow</strong><br /><span class="desc">Programming tags and what they mean.</span></span>
      </label>
    </section>

    <p class="status" id="status" role="status"></p>

    <script src="options.js"></script>
  </body>
</html>
