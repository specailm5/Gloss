<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gloss settings</title>
    <style>
      body {
        margin: 16px;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-width: 320px;
        max-width: 420px;
      }
      h1 { font-size: 15px; margin: 0 0 14px; }
      .row { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
      section {
        margin-top: 14px;
        padding: 12px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 10px;
      }
      .status { font-size: 13px; }
      button {
        margin-top: 10px;
        padding: 6px 12px;
        font: inherit;
        cursor: pointer;
        border: 1px solid rgba(0, 0, 0, 0.2);
        border-radius: 7px;
        background: #2563eb;
        color: #fff;
        border-color: #2563eb;
      }
      button:hover { background: #1d4ed8; }
      pre {
        margin: 10px 0 0;
        padding: 8px;
        background: #f3f4f6;
        border-radius: 6px;
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 200px;
        overflow: auto;
      }
      .hint { color: #6b7280; font-size: 12px; margin: 12px 0 0; }
      @media (prefers-color-scheme: dark) {
        body { background: #1f1f23; color: #e8e8ea; }
        section { border-color: rgba(255, 255, 255, 0.14); }
        pre { background: #2a2a30; }
        .hint { color: #a1a1aa; }
      }
    </style>
  </head>
  <body>
    <h1>Gloss settings</h1>

    <label class="row">
      <input type="checkbox" id="aiEnabled" />
      <span>Use on-device AI when no definition is found</span>
    </label>

    <section>
      <div class="status" id="aiStatus">Checking on-device AI…</div>
      <button type="button" id="aiAction" hidden></button>
      <pre id="aiLog" hidden></pre>
    </section>

    <p class="hint">
      Runs your browser's built-in model locally — Gemini Nano in Chrome, Phi-4-mini
      in Edge. Free, no account, and nothing leaves your device. The model is shared
      by the browser and downloaded only once.
    </p>

    <script src="options.js"></script>
  </body>
</html>
